<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
        FastAPI Blog - {{ title }}
        {% else %}
        Welcome to FastAPI
        {% endif %}
    </title>
    <!-- Tailwind CSS v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col font-sans antialiased">
    <!-- Navigation Bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <a href="/"
                class="flex items-center gap-2 text-xl font-bold text-indigo-600 hover:text-indigo-700 transition">
                <span>🚀 FastAPI Blog</span>
            </a>
            <nav class="flex items-center gap-4 text-sm font-medium text-gray-600">
                <a href="/" class="hover:text-indigo-600 transition">Home</a>
                <a href="/posts" class="hover:text-indigo-600 transition">JSON API</a>
                <a href="/docs" target="_blank"
                    class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition">Docs</a>
            </nav>
        </div>
    </header>
    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
        {% block content %}
        {% endblock content %}
    </main>
    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 FastAPI Blog. Built with FastAPI &amp; Tailwind CSS.</p>
    </footer>
</body>

</html>
